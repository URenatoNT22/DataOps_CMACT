# =====================================================================================
#  DATOS DE DEMO
#  Carga datos FICTICIOS (setup/02_datos_ficticios.sql) en BI_DEV o BI_PROD.
#  Solo para la demo: en un ambiente real los datos llegan por los procesos ETL.
# =====================================================================================
name: Datos de demo

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: Base a poblar
        type: choice
        options: [BI_DEV, BI_PROD, ambas]
        default: ambas
      confirmar:
        description: 'Borra y regenera src.* y tab.* con datos INVENTADOS. Escriba DEMO para confirmar'
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash   # bash -eo pipefail: un error en una tubería (cmd | tee) detiene el paso

jobs:
  poblar:
    name: Datos ficticios en ${{ matrix.base }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: ${{ inputs.ambiente == 'ambas' && fromJSON('["BI_DEV","BI_PROD"]') || fromJSON(format('["{0}"]', inputs.ambiente)) }}
    env:
      SQL_SERVER: ${{ secrets.SQL_SERVER }}
      SQL_USER: ${{ secrets.SQL_USER }}
      SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
      DB: ${{ matrix.base == 'BI_PROD' && (vars.DB_PROD || 'BI_PROD') || (vars.DB_DEV || 'BI_DEV') }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar
        with:
          dotnet: "false"
      - name: Verificar que es una base de demo
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          [ "$CONFIRMAR" = "DEMO" ] || { echo "::error::Escriba DEMO para confirmar."; exit 1; }
          [ -f setup/02_datos_ficticios.sql ] || { echo "::error::Este proyecto no tiene datos de demo."; exit 1; }
          python3 scripts/ci/db.py --base "$DB" consulta --sql "IF OBJECT_ID('src.CREDITO','U') IS NULL OR OBJECT_ID('ctl.HISTORIAL_DESPLIEGUE','U') IS NULL THROW 50000, 'La base no tiene el esquema de demo desplegado por el pipeline. Ejecute primero el workflow Despliegue.', 1;"
      - name: Generar datos ficticios y cargar tablones
        run: python3 scripts/ci/db.py --base "$DB" script --archivo setup/02_datos_ficticios.sql
      - name: Pruebas de datos
        run: python3 scripts/ci/db.py --base "$DB" pruebas --carpeta tests/datos
